
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Descargar la Aplicación</title>
  <script>
    window.onload = function() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;

      // Configura aquí tus enlaces reales
      const playStoreUrl = "https://play.google.com/store/apps/details?id=TU_PACKAGE_NAME";
      const appStoreUrl = "https://apps.apple.com/app/idTU_APP_ID";
      const fallbackUrl = "https://tu-usuario.github.io/tu-app/"; // Pagina general por si abren en PC

      if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        window.location.replace(appStoreUrl);
      } else if (/android/i.test(userAgent)) {
        window.location.replace(playStoreUrl);
      } else {
        window.location.replace(fallbackUrl);
      }
    };
  </script>
</head>
<body>
  <p>Redirigiendo a la tienda correspondiente...</p>
</body>
</html>
