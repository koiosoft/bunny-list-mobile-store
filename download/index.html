
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Descargar la Aplicación</title>
  <script>
    window.onload = function() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;

      // Configura aquí tus enlaces reales
      const playStoreUrl = "https://play.google.com/store/apps/details?id=com.koiosoft.bunnylist";
      const appStoreUrl = "https://apps.apple.com/app/6807145880";
      const fallbackUrl = "https://koiosoft.github.io/bunny-list-mobile-store/"; 

      if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        window.location.replace(appStoreUrl);
      } else if (/android/i.test(userAgent)) {
        window.location.replace(playStoreUrl);
      }
    };
  </script>
</head>
<body>
  <p>Redirigiendo a la tienda correspondiente...</p>
  <p>Si no eres redirigido automáticamente, elige tu plataforma:</p>
  <a href="https://play.google.com/store/apps/details?id=com.koiosoft.bunnylist">Google Play</a> | 
  <a href="https://apps.apple.com/app/6807145880">App Store</a>
</body>
</html>
